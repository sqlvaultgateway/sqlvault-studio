# Labo SQLVault Studio : bases prêtes à l'emploi, remplies avec la Banque Téranga (données fictives).
#
#   docker compose up -d                                  Studio + MySQL + PostgreSQL
#   docker compose --profile sqlserver up -d              + SQL Server (≈ 1,5 Go)
#   docker compose --profile oracle up -d                 + Oracle (≈ 1 Go, demande environ 2 Go de mémoire libre)
#   docker compose --profile sqlserver --profile oracle up -d    tout
#   docker compose logs studio                            adresse à ouvrir (avec son jeton)
#   docker compose down -v                                arrêt et remise à zéro
name: sqlvault-labo

services:
  studio:
    image: ${STUDIO_IMAGE:-mbodji/sqlvault-studio:latest}
    build: ..
    environment:
      STUDIO_LAB: "1"
    ports: ["127.0.0.1:4320:4320"]
    volumes: [studio-data:/data]
    depends_on: [mysql, postgres]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: Labo#Root2026
    volumes: [./init/mysql:/docker-entrypoint-initdb.d:ro, mysql-data:/var/lib/mysql]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: Labo#Root2026
      POSTGRES_DB: teranga_credit
    volumes: [./init/postgres:/docker-entrypoint-initdb.d:ro, postgres-data:/var/lib/postgresql/data]

  sqlserver:
    profiles: [sqlserver]
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Labo#Root2026
      MSSQL_PID: Developer
    volumes: [sqlserver-data:/var/opt/mssql]

  sqlserver-init:
    profiles: [sqlserver]
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      MSSQL_SA_PASSWORD: Labo#Root2026
    volumes: [./init/mssql:/init:ro]
    entrypoint: ["/bin/bash", "/init/init.sh"]
    depends_on: [sqlserver]
    restart: "no"

  oracle:
    profiles: [oracle]
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: Labo#Root2026
      APP_USER: teranga_gl
      APP_USER_PASSWORD: TerangaGl2026
    volumes: [./init/oracle:/container-entrypoint-initdb.d:ro, oracle-data:/opt/oracle/oradata]

volumes: { studio-data: {}, mysql-data: {}, postgres-data: {}, sqlserver-data: {}, oracle-data: {} }
